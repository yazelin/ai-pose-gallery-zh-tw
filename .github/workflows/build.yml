name: build
on:
  schedule: [{cron: '37 19 * * *'}] # 每日台灣時間 03:37
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: '${{ steps.deploy.outputs.page_url }}'}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and translate
        run: |
          mkdir site
          curl -fsSL https://ai-pose-gallery.pages.dev/ -o orig.html
          python3 localize.py orig.html site/index.html
          if [ -s missing.txt ]; then
            { echo '## 對照表沒有的日文字串（頁面上保持日文，補進 zh-tw.json）'; echo '```'; cat missing.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4
